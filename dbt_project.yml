name: 'streaming_analytics'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: 'streaming_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Where the raw Kaggle tables live. Override with --vars if you load them elsewhere.
  source_database: 'plucky-vision-419400'
  source_schema: 'Streaming_project'
  # Range of the date spine that backs dim_dates and the MetricFlow time spine.
  date_spine_start: '2000-01-01'
  date_spine_end: '2031-01-01'

models:
  streaming_analytics:
    +group: content_analytics
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      # Only models in the content_analytics group may ref staging models.
      +access: private
      +docs:
        node_color: '#cd7f32'
    intermediate:
      +materialized: view
      +schema: intermediate
      +access: protected
      +docs:
        node_color: '#c0c0c0'
    marts:
      +materialized: table
      +schema: marts
      # Marts are the public interface: other projects may ref them, and the
      # contract guarantees their column names and data types won't change silently.
      +access: public
      +contract:
        enforced: true
      +docs:
        node_color: '#d4af37'
    utilities:
      +materialized: table
      +schema: marts

seeds:
  streaming_analytics:
    +schema: reference

data_tests:
  streaming_analytics:
    # Tests belong to the same group so they can check the private staging models.
    +group: content_analytics
    # Keep failing rows in the warehouse so they can be inspected with SQL.
    +store_failures: true
    +schema: test_failures
